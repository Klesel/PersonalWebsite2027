# Builds, tests and uploads the site to the Strato webspace via SFTP.
#
# - Manual run (Actions → Deploy → Run workflow): "dry run" is on by default and only
#   lists what would change on the server.
# - Push to main: deploys automatically once the repository variable
#   DEPLOY_ENABLED is set to "true" (Settings → Secrets and variables → Actions → Variables).
#
# Required secrets: SFTP_HOST, SFTP_USER, SFTP_PASSWORD, SFTP_KNOWN_HOSTS
# Optional variable: SFTP_TARGET_DIR (default "/")
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: only show what would change on the server'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      TARGET_DIR: ${{ vars.SFTP_TARGET_DIR || '/' }}
    steps:
      - name: Download the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Trust the server's SSH host key
        env:
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload via SFTP${{ env.DRY_RUN == 'true' && ' (dry run)' || '' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_FLAG="--dry-run"; echo "Dry run – nothing will be changed on the server."; fi
          # --delete removes files on the server that are no longer part of the site.
          # .well-known/ is kept (used e.g. for TLS certificate validation).
          lftp -c "
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes';
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password -u \"$SFTP_USER\" \"sftp://$SFTP_HOST\";
            mirror --reverse --delete --verbose --parallel=4 $DRY_FLAG \
              --exclude-glob .well-known/ \
              dist/ \"$TARGET_DIR\";
          "
